name: unzip-upload
on:
  push:
    branches: [main]
    paths: ['*.zip']
permissions:
  contents: write
  actions: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          set -e
          for z in *.zip; do
            unzip -o "$z"
            git rm -q "$z"
          done
          git config user.name "unzip-bot"
          git config user.email "unzip-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply uploaded zip" || true
          git push
      - name: Trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml || true
