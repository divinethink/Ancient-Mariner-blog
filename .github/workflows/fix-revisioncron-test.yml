name: fix-revisioncron-test
# একবারের workflow (v2): revisionCron.test.ts-এর fake AdminDb-এ setCommentStatus stub বসায় ও commit করে।
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test file
        run: |
          cat > /tmp/patch.mjs <<'JS'
          import fs from "node:fs";
          const f = "src/data/privileged/revisionCron.test.ts";
          const src = fs.readFileSync(f, "utf8");
          if (src.includes("setCommentStatus")) { console.log("already patched"); process.exit(0); }
          const lines = src.split("\n");
          const skip = /^\s*(import|function|export|type|interface)\b|expect\(/;
          const anchors = ["createComment", "commitPublish", "commitDeletes", "batchGet", "runQuery"];
          let done = false;
          for (const a of anchors) {
            const re = new RegExp("(?<![.\\w\"']|(?:const|let|var)\\s+)" + a + "(?=\\s*[:,(}])");
            let n = 0;
            const out = lines.map((l) => {
              if (skip.test(l) || !re.test(l)) return l;
              n++;
              return l.replace(re, 'setCommentStatus: async () => "ok" as const, ' + a);
            });
            if (n > 0) {
              fs.writeFileSync(f, out.join("\n"));
              console.log("patched " + n + " line(s) via anchor " + a);
              done = true;
              break;
            }
          }
          if (!done) {
            console.error("NO ANCHOR FOUND. File head:");
            console.error(lines.slice(0, 40).map((l, i) => (i + 1) + ": " + l).join("\n"));
            process.exit(1);
          }
          JS
          node /tmp/patch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/privileged/revisionCron.test.ts
          git diff --cached --quiet && echo "no change" || (git commit -m "fix: revisionCron.test fake AdminDb-এ setCommentStatus stub" && git push)
