name: fix-revisioncron-test
# একবারের workflow (v3): v2-এর ভুল বসানো (`async setCommentStatus: ...`) ঠিক করে ও commit করে।
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair test file
        run: |
          cat > /tmp/patch.mjs <<'JS'
          import fs from "node:fs";
          const f = "src/data/privileged/revisionCron.test.ts";
          const src = fs.readFileSync(f, "utf8");
          const bad = /async\s+setCommentStatus: async \(\) => "ok" as const,\s*/g;
          const n = (src.match(bad) || []).length;
          if (n === 0) {
            console.error("bad pattern not found. Lines 15-50:");
            console.error(src.split("\n").slice(14, 50).map((l, i) => (i + 15) + ": " + l).join("\n"));
            process.exit(1);
          }
          const out = src.replace(bad, 'setCommentStatus: async () => "ok" as const,\n    async ');
          fs.writeFileSync(f, out);
          console.log("repaired " + n + " spot(s)");
          console.log(out.split("\n").slice(14, 50).map((l, i) => (i + 15) + ": " + l).join("\n"));
          JS
          node /tmp/patch.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/privileged/revisionCron.test.ts
          git diff --cached --quiet && echo "no change" || (git commit -m "fix: revisionCron.test async method + setCommentStatus stub" && git push)
