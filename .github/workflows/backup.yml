name: backup
on:
  schedule:
    - cron: '0 20 * * *' # প্রতিদিন 20:00 UTC = ঢাকায় ভোর ২টা
  workflow_dispatch:
concurrency:
  group: backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ancientmarinerblog
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      BACKUP_TYPE: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backup.ts
