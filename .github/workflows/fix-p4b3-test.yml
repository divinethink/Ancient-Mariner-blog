# একবারের workflow (workflow_dispatch): P4b-৩-র পর stale rules-test-এর একটি assertion হালনাগাদ করে commit করে।
# কারণ: `layout` এখন siteSettings schema-ভুক্ত, তাই সেভে input-এর layout লেখা হয় (আগে 'পরের phase-এর অক্ষত ফিল্ড' ছিল)।
# idempotent — দ্বিতীয়বার চালালে কিছু বদলায় না। কাজ শেষে ফাইলটি মুছে ফেলা যায়।
name: fix-p4b3-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tests/rules/siteSettingsRepo.client.test.ts
        run: |
          python3 - <<'PY'
          import re, sys
          p = "tests/rules/siteSettingsRepo.client.test.ts"
          s = open(p, encoding="utf-8").read()
          lines = s.split("\n")
          idx = [i for i, l in enumerate(lines) if "expect(d?.layout).toEqual(" in l]
          if len(idx) != 1:
              sys.exit("ERROR: layout assertion ঠিক ১টা পাওয়া যায়নি: %d" % len(idx))
          i = idx[0]
          if "sidebar: []" in lines[i]:
              print("already patched"); sys.exit(0)
          indent = re.match(r"\s*", lines[i]).group(0)
          lines[i] = indent + 'expect(d?.layout).toEqual({ sidebar: [], home: [] }); // P4b-৩: layout এখন schema-ভুক্ত — সেভে input-এর মান লেখা হয়'
          s = "\n".join(lines).replace("(menu/layout)", "(menu)", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched line", i + 1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules/siteSettingsRepo.client.test.ts
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "test(rules): P4b-৩ — layout এখন schema-ভুক্ত, stale assertion হালনাগাদ"
          git push
