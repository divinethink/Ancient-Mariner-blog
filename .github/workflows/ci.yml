name: ci
on:
  push:
    paths-ignore: ['*.zip']
  pull_request:
  workflow_dispatch:
# deploy job-এর gate একই run-এর jobs API পড়ে ⇒ actions: read লাগে
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ancientmarinerblog
      FIREBASE_SERVER_API_KEY: ${{ secrets.FIREBASE_SERVER_API_KEY }}
      SITE_URL: https://blog.ancientmariner.workers.dev
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_BROWSER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
  # CI-র **সাথে একই সময়ে** শুরু (needs নেই): build চলতে থাকে, `check` সবুজ হলেই publish। শুধু main-এর push/dispatch — PR/অন্য branch-এ কখনো না (পাবলিক রেপোতে secret নিরাপদ)।
  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy.yml
    with:
      gate: true
    secrets: inherit
