name: install-rules-test-dep
# একবারের workflow: npm registry AI-sandbox-এ নেই, তাই dependency এখানে বসে।
# Actions → install-rules-test-dep → Run workflow; কাজ শেষে এই ফাইল মুছে দিন।
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-exact --save-dev @firebase/rules-unit-testing
      - run: git diff --stat
      - name: Commit and trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dep-bot"
          git config user.email "dep-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "chore: add @firebase/rules-unit-testing (exact)"
            git push origin HEAD:main
          fi
          gh workflow run ci.yml --ref main
