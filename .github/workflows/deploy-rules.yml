name: deploy-rules
on:
  workflow_dispatch:
    inputs:
      owner_uid:
        description: 'ঐচ্ছিক — খালি রাখলে OWNER_UID secret ব্যবহার হয়'
        required: false
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service account
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules + indexes
        env:
          OWNER_UID: ${{ inputs.owner_uid || secrets.OWNER_UID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npm run deploy:rules
