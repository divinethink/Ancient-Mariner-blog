name: deploy
on:
  # CI-র পর (শুধু সবুজ হলে): push/ZIP-upload ⇒ ci চলে ⇒ সফল হলে এই deploy। CI লাল হলে deploy হয় না।
  # workflow_dispatch (ড্যাশবোর্ডের rebuild/প্রকাশ, হাতে Run) ও schedule আগের মতোই সরাসরি চলে।
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # workflow_run-এ: CI সফল + trigger = এই repo-র নিজের push/dispatch (fork-PR কখনো নয় — পাবলিক repo-তে secret-সহ deploy চলে!); অন্য trigger-এ সবসময়
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ancientmarinerblog
      FIREBASE_SERVER_API_KEY: ${{ secrets.FIREBASE_SERVER_API_KEY }}
      SITE_URL: https://blog.ancientmariner.workers.dev
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_BROWSER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run-এ ঠিক যে commit-এ CI সবুজ হয়েছে সেটাই deploy (এর মধ্যে নতুন push এলে সেটার নিজস্ব CI-র পর আলাদা deploy)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build-সময় কমাতে Next-এর compile-cache (শুধু গতি; ডেটা snapshot থেকে, তাই পুরনো লেখা আসে না)
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:cf
      # সাইজ-পরীক্ষা শুধু কোড-push-এ; প্রতি প্রকাশের (schedule/dispatch) ডাবল-bundle বাদ
      - name: Size check (Total Upload ≤ 64MiB)
        if: github.event_name == 'workflow_run'
        run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy
      # নতুন-প্রকাশ তাৎক্ষণিক (/api/live): Worker-এর server-key (public-read; rules-নিয়ন্ত্রিত)। ব্যর্থ হলে deploy থামে না — route তখন 503, সাধারণ 404 থাকে
      - name: Worker secret FIREBASE_SERVER_API_KEY
        continue-on-error: true
        run: printf '%s' "$FIREBASE_SERVER_API_KEY" | npx wrangler secret put FIREBASE_SERVER_API_KEY
      # P11a-১: D1 টেবিল (numbered migration; আগে প্রয়োগ-হওয়াগুলো বাদ — idempotent)
      - run: npx wrangler d1 migrations apply DB --remote
