name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip']
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ancientmarinerblog
      FIREBASE_SERVER_API_KEY: ${{ secrets.FIREBASE_SERVER_API_KEY }}
      SITE_URL: https://blog.ancientmariner.workers.dev
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_BROWSER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cf
      - name: Size check (Total Upload ≤ 64MiB)
        run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy
