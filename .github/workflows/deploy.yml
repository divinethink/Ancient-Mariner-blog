name: deploy
on:
  # ci.yml-এর `deploy` job এটিকে ডাকে (workflow_call): CI-র সাথে একই run-এ, **একসাথে শুরু** — build চলতে থাকে, শেষে CI সবুজ হলেই publish।
  # workflow_dispatch (ড্যাশবোর্ডের rebuild/প্রকাশ, হাতে Run) ও schedule আগের মতোই সরাসরি চলে (CI ছাড়া, দ্রুত)।
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
jobs:
  deploy:
    # একই group ⇒ push-deploy ও ড্যাশবোর্ড-প্রকাশ একটার পর একটা (একসাথে দুটো wrangler deploy নয়)। job-level রাখা হয়েছে (workflow_call-এ নিরাপদ)।
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ancientmarinerblog
      FIREBASE_SERVER_API_KEY: ${{ secrets.FIREBASE_SERVER_API_KEY }}
      SITE_URL: https://blog.ancientmariner.workers.dev
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_BROWSER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build-সময় কমাতে Next-এর compile-cache (শুধু গতি; ডেটা snapshot থেকে, তাই পুরনো লেখা আসে না)
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:cf
      # সাইজ-পরীক্ষা শুধু কোড-push-এ (gate=true); প্রতি প্রকাশের (schedule/dispatch) ডাবল-bundle বাদ
      - name: Size check (Total Upload ≤ 64MiB)
        if: ${{ inputs.gate }}
        run: npx wrangler deploy --dry-run
      # CI-gate: কোড-push-এ build ওপরে CI-র সমান্তরালে হয়ে গেছে; এখানে একই run-এর `check` job সবুজ না হওয়া পর্যন্ত অপেক্ষা (লাল/বাতিল ⇒ publish হয় না)।
      - name: Wait for CI (publish only if tests pass)
        if: ${{ inputs.gate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            c=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "check")][0].conclusion // "pending"')
            echo "check: $c"
            case "$c" in
              success) exit 0 ;;
              pending) sleep 10 ;;
              *) echo "CI $c — deploy বাতিল"; exit 1 ;;
            esac
          done
          echo "CI-র জন্য অপেক্ষার সময় শেষ"; exit 1
      - run: npx wrangler deploy
      # নতুন-প্রকাশ তাৎক্ষণিক (/api/live): Worker-এর server-key (public-read; rules-নিয়ন্ত্রিত)। ব্যর্থ হলে deploy থামে না — route তখন 503, সাধারণ 404 থাকে
      - name: Worker secret FIREBASE_SERVER_API_KEY
        continue-on-error: true
        run: printf '%s' "$FIREBASE_SERVER_API_KEY" | npx wrangler secret put FIREBASE_SERVER_API_KEY
      # P11a-১: D1 টেবিল (numbered migration; আগে প্রয়োগ-হওয়াগুলো বাদ — idempotent)
      - run: npx wrangler d1 migrations apply DB --remote
